   <g id="text_1">
    <text style="font-weight: 700; font-size: 23px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172b46" x="28.8" y="49.876406" transform="rotate(-0 28.8 49.876406)">Recovery without duplicates</text>
   </g>
   <g id="text_2">
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; fill: #52647c" transform="translate(28.8 80.517656)">The server may save our message before an error.</text>
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; fill: #52647c" transform="translate(28.8 99.024023)">Do not automatically resend that message.</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172b46" x="44.64" y="156.917344" transform="rotate(-0 44.64 156.917344)">Save the request before sending</text>
   </g>
   <g id="text_4">
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; fill: #172b46" transform="translate(44.64 178.437656)">Keep the response or transport-error record.</text>
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; fill: #172b46" transform="translate(44.64 196.374141)">Keep a pending marker if outcome is uncertain.</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172b46" x="44.64" y="272.117344" transform="rotate(-0 44.64 272.117344)">Classify the response</text>
   </g>
   <g id="text_6">
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; fill: #172b46" transform="translate(44.64 293.637656)">Valid reply or new scenario: advance normally.</text>
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; fill: #172b46" transform="translate(44.64 311.574141)">Recognized completion: finish the run.</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172b46" x="44.64" y="390.917344" transform="rotate(-0 44.64 390.917344)">Read and verify the server session</text>
   </g>
   <g id="text_8">
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; fill: #172b46" transform="translate(44.64 412.437656)">Check the ID, scenario and exact history.</text>
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; fill: #172b46" transform="translate(44.64 430.374141)">An original timeout waits for a delayed reply.</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172b46" x="28.8" y="490.197656" transform="rotate(-0 28.8 490.197656)">Choose an action only from verified evidence:</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172b46" x="44.64" y="538.517344" transform="rotate(-0 44.64 538.517344)">Matching delayed reply</text>
   </g>
   <g id="text_11">
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; fill: #172b46" transform="translate(44.64 560.037656)">Reconcile the saved exchange and continue.</text>
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; fill: #172b46" transform="translate(44.64 577.974141)">No repost and no administrative close.</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172b46" x="44.64" y="650.117344" transform="rotate(-0 44.64 650.117344)">Verified unanswered turn</text>
   </g>
   <g id="text_13">
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; fill: #172b46" transform="translate(44.64 671.637656)">After grace, recheck the unanswered turn.</text>
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; fill: #172b46" transform="translate(44.64 689.574141)">Close once within policy; verify advancement.</text>
   </g>
   <g id="text_14">
    <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172b46" x="44.64" y="761.717344" transform="rotate(-0 44.64 761.717344)">Uncertain or mismatched evidence</text>
   </g>
   <g id="text_15">
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; fill: #172b46" transform="translate(44.64 783.237656)">Halt and preserve the original records.</text>
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; fill: #172b46" transform="translate(44.64 801.174141)">An uncertain closing request also halts.</text>
   </g>
   <g id="text_16">
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #52647c" transform="translate(28.8 867.437812)">Administrative closes are recorded separately from</text>
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #52647c" transform="translate(28.8 884.710422)">natural researcher stops. They do not prove satisfaction.</text>
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #52647c" transform="translate(28.8 901.983031)"/>
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #52647c" transform="translate(28.8 919.255641)">The completed run kept a 30-minute timeout grace.</text>
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #52647c" transform="translate(28.8 936.52825)">Spend, turn and outage bounds remain active.</text>
   </g>
  </g>
 </g>
