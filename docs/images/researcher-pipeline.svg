   <g id="text_1">
    <text style="font-weight: 700; font-size: 23px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172b46" x="28.8" y="49.876406" transform="rotate(-0 28.8 49.876406)">Inside one researcher turn</text>
   </g>
   <g id="text_2">
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; fill: #52647c" transform="translate(28.8 80.517656)">Two model calls. Exact requests and results</text>
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; fill: #52647c" transform="translate(28.8 99.024023)">are retained privately.</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172b46" x="44.64" y="153.317344" transform="rotate(-0 44.64 153.317344)">1  Build the researcher context</text>
   </g>
   <g id="text_4">
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; fill: #172b46" transform="translate(44.64 174.837656)">Persona + goal fields + available utterance text.</text>
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; fill: #172b46" transform="translate(44.64 192.774141)">No future human reply or reference answer.</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172b46" x="44.64" y="264.917344" transform="rotate(-0 44.64 264.917344)">2  Map the conversation speakers</text>
   </g>
   <g id="text_6">
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; fill: #172b46" transform="translate(44.64 286.437656)">Researcher history → assistant role.</text>
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; fill: #172b46" transform="translate(44.64 304.374141)">Search-assistant history → user role.</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172b46" x="44.64" y="376.517344" transform="rotate(-0 44.64 376.517344)">3  Draft with Luna</text>
   </g>
   <g id="text_8">
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; fill: #172b46" transform="translate(44.64 398.037656)">Task 1: next-message text.</text>
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; fill: #172b46" transform="translate(44.64 415.974141)">Task 2: text + boolean stop decision.</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172b46" x="44.64" y="488.117344" transform="rotate(-0 44.64 488.117344)">4  Make one editor call with Luna</text>
   </g>
   <g id="text_10">
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; fill: #172b46" transform="translate(44.64 509.637656)">Same context, draft and recent researcher voice.</text>
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; fill: #172b46" transform="translate(44.64 527.574141)">Task 1 official: fidelity. Task 2: style.</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172b46" x="44.64" y="599.717344" transform="rotate(-0 44.64 599.717344)">5  Validate and save</text>
   </g>
   <g id="text_12">
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; fill: #172b46" transform="translate(44.64 621.237656)">Reject invalid output; checkpoint before sending.</text>
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; fill: #172b46" transform="translate(44.64 639.174141)">Task 2 keeps the draft’s stop boolean.</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172b46" x="44.64" y="711.317344" transform="rotate(-0 44.64 711.317344)">6  Submit through the organizer API</text>
   </g>
   <g id="text_14">
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; fill: #172b46" transform="translate(44.64 732.837656)">Validate reply, reset or completion.</text>
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; fill: #172b46" transform="translate(44.64 750.774141)">Preserve evidence if the outcome is uncertain.</text>
   </g>
   <g id="text_15">
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #52647c" transform="translate(28.8 809.837812)">Full history is resent explicitly for each request.</text>
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #52647c" transform="translate(28.8 827.110422)">No automatic compaction or repeated judge/retry loop.</text>
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #52647c" transform="translate(28.8 844.383031)"/>
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #52647c" transform="translate(28.8 861.655641)">Editing preserves the stop flag in code; preserving</text>
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #52647c" transform="translate(28.8 878.92825)">meaning and natural voice still requires evaluation.</text>
   </g>
  </g>
 </g>
