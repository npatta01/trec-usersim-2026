   <g id="text_1">
    <text style="font-weight: 700; font-size: 23px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172b46" x="28.8" y="49.876406" transform="rotate(-0 28.8 49.876406)">Task 1 vs Task 2</text>
   </g>
   <g id="text_2">
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; fill: #52647c" transform="translate(28.8 80.517656)">We write the researcher. The organizer supplies</text>
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; fill: #52647c" transform="translate(28.8 99.024023)">the dataset-search assistant.</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #3e67c9" x="28.8" y="145.397344" transform="rotate(-0 28.8 145.397344)">TASK 1  /  Predict one message</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172b46" x="44.64" y="192.917344" transform="rotate(-0 44.64 192.917344)">Organizer supplies a prefix</text>
   </g>
   <g id="text_5">
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; fill: #172b46" transform="translate(44.64 214.437656)">Persona, goal and conversation so far.</text>
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; fill: #172b46" transform="translate(44.64 232.374141)">It can be an opening or any later turn.</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172b46" x="44.64" y="297.317344" transform="rotate(-0 44.64 297.317344)">Return one researcher message</text>
   </g>
   <g id="text_7">
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; fill: #172b46" transform="translate(44.64 318.837656)">One prediction, then a new supplied input.</text>
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; fill: #172b46" transform="translate(44.64 336.774141)">Our prediction is not added to the next prefix.</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #268269" x="28.8" y="416.117344" transform="rotate(-0 28.8 416.117344)">TASK 2  /  Play the conversation</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172b46" x="44.64" y="462.917344" transform="rotate(-0 44.64 462.917344)">We generate a researcher turn</text>
   </g>
   <g id="text_10">
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; fill: #172b46" transform="translate(44.64 484.437656)">Persona, goal and full conversation text.</text>
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; fill: #172b46" transform="translate(44.64 502.374141)">Output: message plus a stop decision.</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172b46" x="44.64" y="567.317344" transform="rotate(-0 44.64 567.317344)">Receive the organizer response</text>
   </g>
   <g id="text_12">
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; fill: #172b46" transform="translate(44.64 588.837656)">Assistant reply: extend our history.</text>
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; fill: #172b46" transform="translate(44.64 606.774141)">New scenario: reset the conversation.</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172b46" x="44.64" y="682.517344" transform="rotate(-0 44.64 682.517344)">A new conversation resets context</text>
   </g>
   <g id="text_14">
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; fill: #172b46" transform="translate(44.64 704.037656)">A stop ends a conversation. Recognized</text>
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; fill: #172b46" transform="translate(44.64 721.974141)">organizer completion ends the whole run.</text>
   </g>
   <g id="text_15">
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #52647c" transform="translate(28.8 759.437812)">Full history means utterance text.</text>
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #52647c" transform="translate(28.8 776.710422)">Raw metadata is retained privately.</text>
   </g>
  </g>
 </g>
